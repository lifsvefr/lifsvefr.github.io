<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lífsvefr · The Life-Weave</title>
<meta name="description" content="Small apps and tall tales, woven from one golden thread.">
<meta name="theme-color" content="#060D1E">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lífsvefr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Caudex:ital,wght@0,400;0,700;1,400&family=Alegreya+SC:wght@500;700&family=Winky+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#E7ECF8;--sun:#C9A227;--sunglow:#E8C766;--mut:#AEBAD8;--navy:#060D1E;--tile:#1E3464}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Caudex',Georgia,serif;background:linear-gradient(180deg,#060D1E 0%,#0B1B3C 55%,#0A1226 100%);background-attachment:fixed;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars span{position:absolute;animation:tw var(--d,3s) ease-in-out infinite var(--delay,0s);font-size:var(--sz,.8rem);color:var(--col,#E8C766);text-shadow:0 0 6px var(--col,#E8C766);line-height:1}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.85;transform:scale(1)}}

  /* one screen, no scrolling: the header and the three doors sit in the middle, the motto at the foot */
  .page{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:620px;width:100%;margin:0 auto}

  .kicker{font-family:'Alegreya SC',serif;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--sunglow);text-shadow:0 0 8px var(--navy),0 0 16px var(--navy)}
  h1{font-family:'Homemade Apple',cursive;font-weight:400;font-size:clamp(40px,11vw,56px);line-height:1.5;margin-top:30px;color:#F4F7FF;
    text-shadow:2px 0 0 var(--navy),-2px 0 0 var(--navy),0 2px 0 var(--navy),0 -2px 0 var(--navy),0 0 14px var(--navy),0 0 28px var(--navy)}
  .tag{font-family:'Winky Sans',sans-serif;font-size:15px;line-height:1.8;color:var(--mut);margin-top:40px;max-width:30ch}
  .threadline{height:2px;width:200px;margin:50px auto 60px;background:linear-gradient(90deg,transparent,var(--sun),transparent);border-radius:2px}

  /* the three doors: Söguþræðir · Lífsteinn · Nafnaþula */
  .doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:460px}
  a.door{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:6px 2px 10px;border-radius:22px;-webkit-tap-highlight-color:transparent}
  .door .ic{width:84px;height:84px;border-radius:22px;border:1px solid rgba(201,162,39,.6);background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 22px rgba(232,199,102,.16);transition:transform .15s ease,box-shadow .18s ease,border-color .18s ease}
  .door .ic img{width:100%;height:100%;object-fit:cover;display:block}
  .door .ic .emo{font-size:38px;display:none}
  .door .ic.noimg img{display:none}.door .ic.noimg .emo{display:block}
  .door .nm{font-family:'Alegreya SC',serif;font-weight:700;font-size:16px;line-height:1.2}
  .door .en{font-family:'Winky Sans',sans-serif;font-size:12px;font-weight:600;color:var(--mut);margin-top:-6px}
  a.door:hover .ic,a.door:focus-visible .ic{border-color:var(--sun);box-shadow:0 0 26px rgba(232,199,102,.32);transform:translateY(-2px)}
  a.door:active .ic{transform:scale(.96);box-shadow:0 0 28px rgba(232,199,102,.45)}
  a.door:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
  /* Lífsteinn, in the middle, carries the brightest glow */
  a.door.mid .ic{border-color:rgba(201,162,39,.85);box-shadow:0 0 30px rgba(232,199,102,.28)}

  footer{text-align:center;font-family:'Winky Sans',sans-serif;font-size:12.5px;color:var(--mut);padding-top:28px}
  footer .motto{font-family:'Caudex',serif;font-style:italic;font-size:15px;color:var(--ink);margin-bottom:6px}

  @media (min-width:700px){.door .ic{width:104px;height:104px;border-radius:26px}.doors{gap:28px}.door .nm{font-size:18px}}
  @media (max-height:740px){h1{margin-top:20px}.tag{margin-top:26px}.threadline{margin:34px auto 40px}}
  @media (max-height:620px){h1{margin-top:8px}.tag{margin-top:14px}.threadline{margin:20px auto 26px}footer{padding-top:16px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<div class="page">
  <main>
    <div class="kicker">The Life-Weave</div>
    <h1>Lífsvefr</h1>
    <p class="tag">Small apps and tall tales, woven from one golden thread.</p>
    <div class="threadline" aria-hidden="true"></div>

    <nav class="doors" aria-label="The apps">
      <a class="door" href="./scriptorium/">
        <span class="ic"><img src="./scriptorium/icon-192.png" alt=""><span class="emo" aria-hidden="true">✒️</span></span>
        <span class="nm">Söguþræðir</span>
        <span class="en">Scriptorium</span>
      </a>
      <a class="door mid" href="./lifestone/">
        <span class="ic"><img src="./lifestone/icon-192.png" alt=""><span class="emo" aria-hidden="true">💎</span></span>
        <span class="nm">Lífsteinn</span>
        <span class="en">Life Stone</span>
      </a>
      <a class="door" href="./namelist/">
        <span class="ic"><img src="./namelist/icon-192.png" alt=""><span class="emo" aria-hidden="true">📜</span></span>
        <span class="nm">Nafnaþula</span>
        <span class="en">Name List</span>
      </a>
    </nav>
  </main>

  <footer>
    <div class="motto">One life, many threads.</div>
    <div>First lit under the Bondfire Moon 🔥</div>
  </footer>
</div>

<script>
'use strict';
/* an icon that hasn't been made yet shows its emblem instead */
document.querySelectorAll('.door .ic img').forEach(function(im){
  function miss(){ im.parentNode.classList.add('noimg'); }
  im.addEventListener('error',miss);
  if(im.complete&&!im.naturalWidth) miss();
});
/* the same night sky as Lífsteinn and Söguþræðir */
(function(){
  var gl=['✦','✧','⋆','·','✵','✦','·','⋆'], cols=['#E8C766','#BFD4F2','#9FE3C0','#F4F7FF','#7C9AE0'], h='';
  for(var i=0;i<70;i++){
    h+='<span style="top:'+(Math.random()*100).toFixed(1)+'%;left:'+(Math.random()*100).toFixed(1)+'%;--d:'+(2.5+Math.random()*5).toFixed(1)+'s;--delay:-'+(Math.random()*7).toFixed(1)+'s;--sz:'+(Math.random()*0.7+0.35).toFixed(2)+'rem;--col:'+cols[Math.floor(Math.random()*cols.length)]+'">'+gl[Math.floor(Math.random()*gl.length)]+'</span>';
  }
  document.getElementById('stars').innerHTML=h;
})();
/* the hub app only covers this one page (so Lífsteinn and Söguþræðir stay their own separate apps);
   show the address as /index.html so Chrome offers to install it */
if(location.pathname==='/'){ try{ history.replaceState(null,'','/index.html'+location.search+location.hash); }catch(e){} }
/* lets Lífsvefr be installed as an app, and open without internet */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){ navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){}); }
</script>
</body>
</html>
